services:
  - type: web
    name: lavero-maison
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: "LAVÉRO Maison"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
